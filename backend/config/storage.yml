test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# The Playwright suite. Its own root, not `local` — `local` is backend/storage,
# which holds the developer's own development uploads, and the reset endpoint
# empties this directory on every call.
e2e:
  service: Disk
  root: <%= Rails.root.join("tmp/e2e_storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Production: S3 via ECS IAM task role (no access keys needed).
# AWS_BUCKET and AWS_REGION are injected by the ECS task definition.
amazon:
  service: S3
  region: <%= ENV.fetch("AWS_REGION", "ap-southeast-1") %>
  bucket: <%= ENV.fetch("AWS_BUCKET", "rally") %>

# Kamal base configuration — **staging only**.
#
# Production does not deploy with Kamal. It runs on ECS Fargate, rolled by
# .github/workflows/deploy.yml and scripts/deploy.sh, with task definitions
# owned by Terraform in infrastructure/. See .claude/rules/infrastructure.md.
# This file used to be unconfigured `rails new` scaffolding pointing at
# 192.168.0.1; it is now real, but only for the staging box.
#
# There are deliberately **no `servers:` here**, so a bare `kamal deploy` with
# no destination fails rather than guessing. Every invocation names one:
#
#   bin/kamal setup    -d staging    # first time only
#   bin/kamal deploy   -d staging
#   bin/kamal rollback -d staging
#   bin/kamal app logs -d staging -f
#
# Everything environment-specific lives in deploy.staging.yml, which Kamal
# merges over this file.

service: rally

# Overridden per destination with the full ECR repository URL. Kamal uses this
# for the local build tag too, so it has to be set somewhere in the base.
image: rally-api

registry:
  # ECR, logged into by the workflow before `kamal deploy`. The staging
  # repository is NOT production's — Kamal pushes a `latest` tag and
  # production's ECS task definitions pull `:latest`, so one shared repository
  # would mean merging to `staging` re-points production at a staging image.
  # infrastructure/staging/storage.tf has the full reasoning.
  server: <%= ENV["KAMAL_REGISTRY_SERVER"] %>
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  # linux/amd64 — the staging instance is x86_64 (see
  # infrastructure/staging/main.tf, which pins an amd64 AMI for this reason).
  # An arm64 image on a t3 box fails at container start, not at build.
  arch: amd64

  # No build cache configured, deliberately. `cache: { type: gha }` is the
  # obvious win — the Dockerfile compiles native gems and a cold build takes
  # minutes — but it needs buildx's GitHub cache backend, which means a
  # container builder plus ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL exported
  # into the step. That is three more things that can fail on a path nobody
  # watches. Worth adding once staging deploys are boring; not worth it as
  # part of standing them up.

# Active Storage attachments go to S3 via the instance profile, exactly as
# production uses the ECS task role — so there is no uploads volume here.
# This volume is Rails' own `storage/` directory, which Active Storage's Disk
# service would use if the service were ever misconfigured; keeping it means
# that misconfiguration loses nothing on a redeploy.
volumes:
  - "rally_storage:/rails/storage"

# This is an API-only app with no asset pipeline output to bridge, so the
# scaffolding's asset_path is deliberately absent — pointing it at a directory
# that doesn't exist makes Kamal warn on every deploy.

ssh:
  user: ubuntu

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  # Staging is disposable by design. This is the "give me a clean slate"
  # button, and it is why the e2e reset endpoint's `if Rails.env.e2e?` guard
  # matters — staging runs as RAILS_ENV=production, so that endpoint does not
  # exist here and this is the only way.
  reset-db: app exec "bin/rails db:drop db:prepare db:seed"

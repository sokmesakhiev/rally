# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Frees capacity held by paid-event registrations that were abandoned before
  # payment. Hourly is deliberate rather than lazy: the grace period is an hour
  # (Registrations::ReleaseAbandoned::GRACE_PERIOD), so a slot is released
  # between one and two hours after abandonment. Running it more often would
  # only narrow that window, not the grace period, which is where the real
  # latency is.
  #
  # Offset from the cleanup job above so two sweeps aren't contending for the
  # worker's three job threads at the top of every hour.
  #
  # Note these run wherever the Solid Queue scheduler runs, which since the
  # worker split is the jobs service — so `ecs_worker_desired_count = 0` stops
  # them. Scaling the other way is safe: solid_queue_recurring_executions is
  # uniquely indexed on (task_key, run_at), so N schedulers enqueue each
  # occurrence exactly once.
  release_abandoned_registrations:
    class: ReleaseAbandonedRegistrationsJob
    schedule: every hour at minute 37

  # Certificate previews are scratch renders an organizer looked at once.
  # Each re-preview orphans the previous PDF in S3 (the row keeps only the
  # newest URL), so without this they accumulate unreferenced and invisible.
  # Offset again from the two sweeps above rather than sharing their minute —
  # all three compete for the same worker threads.
  sweep_certificate_previews:
    command: "Certificates::SweepPreviews.call"
    schedule: every hour at minute 52

# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  username: postgres
  password: postgres
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  #
  # `max_connections` is the canonical key as of Rails 8.1 — `pool` is now a
  # deprecated alias for it, and setting both to different values raises
  # outright (ActiveRecord::DatabaseConfigurations::HashConfig). Don't "fix"
  # this back to `pool`.
  #
  # Pools are lazy and reaped: this is a ceiling on concurrent checkouts, not a
  # set of connections held open. The production `primary` and `cache` roles
  # override it below, because ActionCable's worker threads check out from both.
  #
  # Deliberately NOT keyed on RAILS_MAX_THREADS. It used to be, and that made
  # this value a hidden function of Puma's thread count: the moment
  # RAILS_MAX_THREADS was set explicitly in ecs.tf (3), every role inheriting
  # this default silently dropped from 5 to 3 — including `queue`, where Solid
  # Queue already runs 3 worker threads plus a dispatcher and a heartbeat. One
  # knob, two unrelated meanings. RAILS_DB_POOL is the floor for roles that
  # don't state their own.
  max_connections: <%= ENV.fetch("RAILS_DB_POOL") { 5 } %>


development:
  <<: *default
  database: backend_development

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: backend

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: backend_test

# The Playwright end-to-end suite (docs/e2e-testing-design.md). A database of
# its own, deliberately: the suite truncates every table between journeys, and
# doing that to `backend_test` would break a developer running specs in
# another terminal, while doing it to `backend_development` would destroy
# their own data.
#
# Only `primary` is declared. The solid_queue / solid_cache / solid_cable gems
# are in the `:production` bundle group, so in this environment there is
# nothing to point a `queue`/`cache`/`cable` role at — config/environments/
# e2e.rb uses the :async job adapter and a memory cache store instead.
#
# The pool is larger than the default 5 because ActiveJob's :async adapter
# runs jobs on threads inside this same process, checking out connections
# alongside Puma's request threads. Nothing here is sized for load; it is
# sized so a journey can't fail with a checkout timeout, which is the least
# informative way an e2e test can die.
e2e:
  <<: *default
  database: rally_e2e
  max_connections: <%= ENV.fetch("RAILS_DB_POOL") { 15 } %>

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  # DATABASE_URL is injected by ECS at task startup from Secrets Manager.
  # It takes precedence over all values below when set.
  # Format: postgresql://user:pass@host:5432/dbname
  #
  # cache/queue/cable each build their OWN url (same host/user/pass, swapped
  # database name) rather than inheriting `url:` from primary and adding a
  # sibling `database:` key. That more obvious-looking approach silently
  # doesn't work: when a config hash has both `url:` and `database:`, this
  # Rails/pg version resolves the connection using the URL's embedded
  # database name and ignores the `database:` override — so all four roles
  # end up pointing at the exact same physical database (confirmed via
  # `ActiveRecord::Base.configurations.configs_for(...).database` returning
  # the same name for "primary" and "queue" in production). Rebuilding the
  # URL per role sidesteps the ambiguous merge entirely.
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    # Two consumers share this pool inside a Puma process: Puma's own request
    # threads, and ActionCable's worker pool (channel callbacks and broadcasts
    # run there, and they touch application models). Solid Queue was a third
    # until it moved to its own ECS service; the formula is unchanged, which
    # simply means the web task now has more headroom than the arithmetic
    # claims. Left at the `default` value of 5 while ActionCable was being
    # enabled, checkouts would start timing out after the default 5-second
    # wait — intermittently, only under concurrency.
    #
    # Sized from the same two env vars that drive the consumers themselves, so
    # raising either one can't silently starve the pool. Headroom of 3 covers
    # migrations on boot and a human on a console.
    #
    # Budget check: db.t3.micro (1 GiB) allows Postgres ~112 connections.
    #
    #   web task (RAILS_MAX_THREADS=3, ACTION_CABLE_WORKER_POOL_SIZE=4):
    #     primary 10 + cache 8 + queue 5 + cable 5 = 28
    #   worker task: counted per *process*, because Solid Queue's supervisor
    #     forks — supervisor, dispatcher, scheduler and one worker, each with
    #     its own pools. RAILS_DB_POOL=6 is the queue ceiling for each of the
    #     four (24), but only the worker process gets near it (3 job threads +
    #     polling + heartbeat = 5); the others sit at one or two. Real usage is
    #     ~10 on queue and ~4 on primary, since only the worker process runs
    #     job code. cache/cable are configured and never touched.
    #
    # infrastructure/terraform.tfvars runs one task of each, so roughly 42 in
    # use against ~112 available, with a worst case near 70 if every pool on
    # every process filled at once. These are ceilings, not the resting state:
    # pools open connections on demand and reap them after ~5 minutes idle.
    # The number to watch when raising ecs_worker_desired_count is the *worker*
    # one, since it multiplies by four processes per task.
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 3).to_i + ENV.fetch("ACTION_CABLE_WORKER_POOL_SIZE", 4).to_i + 3 %>
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"].to_s.sub(%r{/[^/?]+(\?.*)?\z}, "/backend_production_cache\\1") %>
    migrations_paths: db/cache_migrate
    # Sized like primary, and for the same reason: ActionCable's workers hit
    # this pool too. Cable::Ticket#redeem is a Rails.cache read running on a
    # cable worker thread, while Puma's request threads are concurrently using
    # the same store for rack-attack's throttle counters.
    #
    # The load here is spikiest exactly when it's least affordable: every
    # deploy severs every socket at once, so all clients redeem a ticket within
    # the same second or two. A pool sized for steady state would fail only
    # during reconnect storms, which is the worst possible time to find out.
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 3).to_i + ENV.fetch("ACTION_CABLE_WORKER_POOL_SIZE", 4).to_i + 1 %>
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"].to_s.sub(%r{/[^/?]+(\?.*)?\z}, "/backend_production_queue\\1") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL"].to_s.sub(%r{/[^/?]+(\?.*)?\z}, "/backend_production_cable\\1") %>
    migrations_paths: db/cable_migrate

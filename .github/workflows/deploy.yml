name: Deploy to main

on:
  push:
    branches: ["main"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before }}
          ref:  ${{ github.sha }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    # Deploy approval gate. This job pauses until a required reviewer
    # approves it, provided the "production" environment has protection
    # rules configured in GitHub (Settings → Environments → production →
    # "Required reviewers"). Declaring the environment here is only half
    # the gate — WITHOUT those repo-side protection rules this changes
    # nothing and a push to main still deploys straight through, so that
    # setting must be turned on for this to actually block anything.
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          # VITE_* vars are inlined at build time, so anything the bundle needs
          # has to be present here rather than at runtime. All optional — each
          # feature degrades gracefully when its var is empty (see
          # frontend/.env.example).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Site key, not the secret — same "not actually sensitive, meant to
          # be embedded in the bundle" status as VITE_GOOGLE_CLIENT_ID, so
          # `vars.` not `secrets.`. Pair with the backend's recaptcha_secret_key
          # (terraform.tfvars) — see RecaptchaVerifier.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{secrets.AWS_REGION}}

      # Only dist/client/ is the deployable static site — vite.config.ts's
      # nitro:false + tanstackStart.spa build writes dist/client/ (assets +
      # the prerendered index.html shell) and dist/server/ (used locally to
      # drive that prerender, not needed at runtime since nothing here ever
      # runs a server). Long-lived immutable cache for hashed assets;
      # index.html is synced separately with no-cache so a new deploy is
      # visible immediately instead of waiting out the old cache lifetime.
      - name: Deploy to S3
        run: |
          aws s3 sync dist/client/ s3://${{secrets.S3_BUCKET}} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          aws s3 cp dist/client/index.html s3://${{secrets.S3_BUCKET}}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation  --distribution-id ${{secrets.CLOUDFRONT_DIST_ID}} --paths "/*"

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # Same approval gate as deploy-frontend — see the comment there for why
    # the repo-side environment protection rules are the part that actually
    # blocks. Note this gate is especially load-bearing for the backend:
    # bin/docker-entrypoint runs db:prepare on boot, so an approved deploy
    # is also what runs migrations against production.
    environment:
      name: production
      url: ${{ vars.VITE_API_URL }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Fargate task definitions run linux/amd64; build for that explicitly
      # so this also works when the runner/build host is arm64.
      - name: Build and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      # The ECS task definition always points at the ":latest" tag (see
      # infrastructure/ecs.tf, var.rails_image_tag) and Terraform ignores
      # container_definitions after the first apply — so a deploy is just
      # "push a new :latest and tell the service to re-pull it", the same
      # thing scripts/deploy.sh does for manual/local deploys. Migrations
      # run automatically on boot via bin/docker-entrypoint (db:prepare).
      - name: Deploy to ECS
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --output json > /dev/null

          echo "Waiting for the ECS service to stabilise..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

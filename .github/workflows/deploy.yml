name: Deploy to main

on:
  push:
    branches: ["main"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before }}
          ref:  ${{ github.sha }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    # Deploy approval gate. This job pauses until a required reviewer
    # approves it, provided the "production" environment has protection
    # rules configured in GitHub (Settings → Environments → production →
    # "Required reviewers"). Declaring the environment here is only half
    # the gate — WITHOUT those repo-side protection rules this changes
    # nothing and a push to main still deploys straight through, so that
    # setting must be turned on for this to actually block anything.
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          # VITE_* vars are inlined at build time, so anything the bundle needs
          # has to be present here rather than at runtime. All optional — each
          # feature degrades gracefully when its var is empty (see
          # frontend/.env.example).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Site key, not the secret — same "not actually sensitive, meant to
          # be embedded in the bundle" status as VITE_GOOGLE_CLIENT_ID, so
          # `vars.` not `secrets.`. Pair with the backend's recaptcha_secret_key
          # (terraform.tfvars) — see RecaptchaVerifier.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{secrets.AWS_REGION}}

      # Only dist/client/ is the deployable static site — vite.config.ts's
      # nitro:false + tanstackStart.spa build writes dist/client/ (assets +
      # the prerendered index.html shell) and dist/server/ (used locally to
      # drive that prerender, not needed at runtime since nothing here ever
      # runs a server). Long-lived immutable cache for hashed assets;
      # index.html is synced separately with no-cache so a new deploy is
      # visible immediately instead of waiting out the old cache lifetime.
      - name: Deploy to S3
        run: |
          aws s3 sync dist/client/ s3://${{secrets.S3_BUCKET}} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "sw.js"

          aws s3 cp dist/client/index.html s3://${{secrets.S3_BUCKET}}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

          # sw.js must never be cached — browsers re-fetch the service worker
          # to check for updates, so an immutable cache would make the worker
          # on someone's device permanently unreplaceable. Mirrors
          # scripts/deploy.sh; see docs/PUSH-NOTIFICATIONS.md.
          aws s3 cp dist/client/sw.js s3://${{secrets.S3_BUCKET}}/sw.js \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/javascript"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation  --distribution-id ${{secrets.CLOUDFRONT_DIST_ID}} --paths "/*"

      # continue-on-error is deliberate: a broken Telegram integration (bad
      # token/chat id, API outage) shouldn't flip an otherwise-successful
      # deploy to red in the Actions UI. --fail-with-body still makes curl
      # itself exit non-zero on a Telegram API error, so that failure is
      # visible as a step warning instead of vanishing silently — the
      # previous `curl --silent` (no -f) always exited 0 regardless of what
      # Telegram actually returned, so a wrong token/chat id would fail with
      # zero indication anything was wrong.
      - name: Notify Telegram — success
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Rally frontend deployment succeeded"
          MESSAGE=$(printf '✅ Rally frontend deployed\nRepo: %s\nBranch: %s\nCommit: %s\nRun: %s' \
            "$REPO" "$BRANCH" "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MESSAGE"

      - name: Notify Telegram — failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Rally frontend deployment failed"
          MESSAGE=$(printf '❌ Rally frontend deployment failed\nRepo: %s\nBranch: %s\nCommit: %s\nRun: %s' \
            "$REPO" "$BRANCH" "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MESSAGE"

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # Same approval gate as deploy-frontend — see the comment there for why
    # the repo-side environment protection rules are the part that actually
    # blocks. Note this gate is especially load-bearing for the backend:
    # bin/docker-entrypoint runs db:prepare on boot, so an approved deploy
    # is also what runs migrations against production.
    environment:
      name: production
      url: ${{ vars.VITE_API_URL }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Fargate task definitions run linux/amd64; build for that explicitly
      # so this also works when the runner/build host is arm64.
      - name: Build and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      # The ECS task definitions always point at the ":latest" tag (see
      # infrastructure/ecs.tf, var.rails_image_tag) — so a deploy is just
      # "push a new :latest and tell the service to re-pull it", the same
      # thing scripts/deploy.sh does for manual/local deploys. Migrations
      # run automatically on boot via bin/docker-entrypoint (db:prepare),
      # on the web task only.
      - name: Deploy to ECS (web)
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --output json > /dev/null

          echo "Waiting for the ECS service to stabilise..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # Solid Queue runs in its own service off the same image, so it needs its
      # own force-new-deployment — without this it keeps serving jobs from the
      # previous build indefinitely, and nothing surfaces that.
      #
      # This step runs after the web service is stable on purpose: the web task
      # is the one that runs migrations, so finishing it first means the worker
      # starts new code against a schema that already matches.
      #
      # A missing ECS_WORKER_SERVICE **fails the build**. It used to emit a
      # `::warning::` and `exit 0`, on the grounds that a repo which hadn't
      # added the secret yet shouldn't get a red build for an otherwise-good
      # deploy. That was the wrong trade twice over:
      #
      #   * `exit 0` let the job succeed, which let the "✅ Rally backend
      #     deployed" Telegram message fire. The one notification anyone
      #     actually reads said the deploy worked while half of it hadn't.
      #     A warning annotation nobody opens the Actions tab to see is not
      #     "loud", whatever the old comment here claimed.
      #   * Since the monitoring work, `WorkerLivenessJob` only reaches
      #     production through *this* step. Skip it and the worker never runs
      #     the new code, so no liveness line is ever emitted and
      #     `rally-production-worker-not-running-jobs` fires permanently —
      #     against a deploy that reported success.
      #
      # Failing here leaves the API on the new image and the worker on the old
      # one. That is a genuinely broken state, so a red build describes it
      # accurately; the message below says so rather than leaving it to be
      # worked out. Set the secret to the `ecs_worker_service_name` Terraform
      # output ("<app>-<env>-worker") and re-run.
      - name: Deploy to ECS (jobs)
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_WORKER_SERVICE: ${{ secrets.ECS_WORKER_SERVICE }}
        run: |
          if [ -z "$ECS_WORKER_SERVICE" ]; then
            echo "::error title=Worker not deployed::ECS_WORKER_SERVICE is unset. The API is now running the NEW image and the Solid Queue worker is still on the PREVIOUS one."
            echo ""
            echo "The backend is half-deployed. Until this is fixed:"
            echo "  * jobs run old code (certificates, waitlist sweeps, notifications)"
            echo "  * WorkerLivenessJob never runs, so the CloudWatch liveness alarm stays in ALARM"
            echo ""
            echo "Fix: set the ECS_WORKER_SERVICE repo secret to the 'ecs_worker_service_name'"
            echo "Terraform output (\"<app>-<env>-worker\"), then re-run this workflow."
            exit 1
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --force-new-deployment \
            --output json > /dev/null

          # No health check on the worker task (nothing listens on a port), so
          # this proves the supervisor booted and stayed up — not that jobs are
          # being processed. See infrastructure/ecs.tf for why.
          echo "Waiting for the worker service to stabilise..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE"

      - name: Notify Telegram — success
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Rally backend deployment succeeded"
          MESSAGE=$(printf '✅ Rally backend deployed\nRepo: %s\nBranch: %s\nCommit: %s\nRun: %s' \
            "$REPO" "$BRANCH" "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MESSAGE"

      - name: Notify Telegram — failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Rally backend deployment failed"
          MESSAGE=$(printf '❌ Rally backend deployment failed\nRepo: %s\nBranch: %s\nCommit: %s\nRun: %s' \
            "$REPO" "$BRANCH" "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MESSAGE"
